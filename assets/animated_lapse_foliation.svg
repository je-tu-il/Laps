<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#10192b" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="surface1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#11998e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38ef7d" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="surface2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="lapseArrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>

    <linearGradient id="shiftArrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a18cd1" />
      <stop offset="100%" stop-color="#fbc2eb" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <marker id="arrowLapse" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#fda085" />
    </marker>
    <marker id="arrowShift" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#fbc2eb" />
    </marker>
    <marker id="arrowCoord" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#38ef7d" />
    </marker>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px #fda085); }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #ff7b54); }
    }
    @keyframes waveFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes particleMove {
      0% { offset-distance: 0%; opacity: 0.2; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0.2; }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -40; }
    }
    .pulse-vector { animation: pulseGlow 3s infinite ease-in-out; }
    .floating-layer { animation: waveFloat 5s infinite ease-in-out; }
    .travel-line { stroke-dasharray: 6 4; animation: dashTravel 2s linear infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #8b949e; }
    .math-text { font-family: "Courier New", monospace, serif; font-size: 14px; fill: #58a6ff; font-weight: 600; }
    .label-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="900" height="520" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Header Banner -->
  <g transform="translate(40, 42)">
    <text class="title-text" x="0" y="0">FEUILLETAGE 3+1 D'ARNOWITT-DESER-MISNER (ADM)</text>
    <text class="sub-text" x="0" y="24">Décomposition spatio-temporelle : Fonction de Laps (N) et Vecteur de Décalage (βⁱ)</text>
  </g>

  <!-- Formula Badge -->
  <g transform="translate(510, 25)">
    <rect x="0" y="0" width="350" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text class="math-text" x="15" y="30">ds² = -N²dt² + h_ij(dxⁱ + βⁱdt)(dxʲ + βʲdt)</text>
  </g>

  <!-- Grid lines background -->
  <g opacity="0.12" stroke="#4facfe" stroke-width="0.8">
    <line x1="50" y1="120" x2="850" y2="120" stroke-dasharray="4 4" />
    <line x1="50" y1="200" x2="850" y2="200" stroke-dasharray="4 4" />
    <line x1="50" y1="280" x2="850" y2="280" stroke-dasharray="4 4" />
    <line x1="50" y1="360" x2="850" y2="360" stroke-dasharray="4 4" />
    <line x1="50" y1="440" x2="850" y2="440" stroke-dasharray="4 4" />
  </g>

  <!-- MAIN DIAGRAM: Surfaces and Vectors -->
  <g id="geometryGroup">

    <!-- Lower Hypersurface Sigma_t -->
    <g class="floating-layer">
      <!-- Curved surface path -->
      <path d="M 100 390 Q 300 420 500 380 T 800 370 L 760 410 Q 500 420 300 450 T 80 430 Z"
            fill="url(#surface1Grad)" stroke="#11998e" stroke-width="1.8" />
      <!-- Coordinate grid curves on Sigma_t -->
      <path d="M 120 400 Q 310 425 490 395 T 780 380" fill="none" stroke="#38ef7d" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <path d="M 250 410 Q 380 405 520 400" fill="none" stroke="#38ef7d" stroke-width="1" opacity="0.4" />
      <path d="M 400 425 Q 520 410 650 395" fill="none" stroke="#38ef7d" stroke-width="1" opacity="0.4" />

      <!-- Label Sigma_t -->
      <rect x="730" y="420" width="120" height="26" rx="5" fill="#161b22" stroke="#11998e" stroke-width="1" />
      <text class="label-tag" x="742" y="437" fill="#38ef7d">Hypersurface Σ_t</text>
      <text class="sub-text" x="742" y="460" font-size="11">Temps coordonnée t</text>
    </g>

    <!-- Upper Hypersurface Sigma_(t+dt) -->
    <g class="floating-layer" style="animation-delay: -2.5s;">
      <!-- Curved surface path -->
      <path d="M 100 200 Q 300 230 500 190 T 800 180 L 760 220 Q 500 230 300 260 T 80 240 Z"
            fill="url(#surface2Grad)" stroke="#00f2fe" stroke-width="1.8" />
      <!-- Coordinate grid curves on Sigma_(t+dt) -->
      <path d="M 120 210 Q 310 235 490 205 T 780 190" fill="none" stroke="#4facfe" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <path d="M 250 220 Q 380 215 520 210" fill="none" stroke="#4facfe" stroke-width="1" opacity="0.4" />
      <path d="M 400 235 Q 520 220 650 205" fill="none" stroke="#4facfe" stroke-width="1" opacity="0.4" />

      <!-- Label Sigma_(t+dt) -->
      <rect x="730" y="170" width="140" height="26" rx="5" fill="#161b22" stroke="#00f2fe" stroke-width="1" />
      <text class="label-tag" x="740" y="187" fill="#00f2fe">Hypersurface Σ_(t+dt)</text>
      <text class="sub-text" x="740" y="210" font-size="11">Incrément temporel dt</text>
    </g>

    <!-- Points and Vectors -->
    <!-- Base point P on Sigma_t (x^i, t) -->
    <circle cx="340" cy="405" r="5.5" fill="#ffffff" filter="url(#glow)" />
    <text class="label-tag" x="300" y="430" fill="#ffffff">P(xⁱ, t)</text>

    <!-- Orthogonal projection point P_perp on Sigma_(t+dt) -->
    <circle cx="340" cy="220" r="4" fill="#fda085" />
    
    <!-- Shifted target point P' on Sigma_(t+dt) (x^i + dx^i, t + dt) -->
    <circle cx="480" cy="210" r="5.5" fill="#38ef7d" filter="url(#glow)" />
    <text class="label-tag" x="500" y="212" fill="#38ef7d">P'(xⁱ + dxⁱ, t+dt)</text>

    <!-- VECTORS -->
    <!-- 1. Normal Lapse Vector N * n^mu dt (Perpendicular to Sigma_t) -->
    <line x1="340" y1="405" x2="340" y2="225" stroke="url(#lapseArrowGrad)" stroke-width="3.5" marker-end="url(#arrowLapse)" class="pulse-vector" />
    
    <!-- 2. Shift Vector beta^i dt (Tangent to Sigma_(t+dt)) -->
    <line x1="340" y1="220" x2="475" y2="210" stroke="url(#shiftArrowGrad)" stroke-width="3" marker-end="url(#arrowShift)" stroke-dasharray="4 2" />

    <!-- 3. Full evolution coordinate vector (t-vector = N n^mu + beta^i) -->
    <line x1="340" y1="405" x2="476" y2="214" stroke="#38ef7d" stroke-width="2.2" marker-end="url(#arrowCoord)" class="travel-line" />

    <!-- Vector Annotation Badges -->
    <!-- Lapse Badge -->
    <g transform="translate(170, 290)">
      <rect x="0" y="0" width="155" height="52" rx="6" fill="#1f1816" stroke="#fda085" stroke-width="1.2" />
      <text class="label-tag" x="10" y="20" fill="#fda085">FONCTION DE LAPS : N</text>
      <text class="math-text" x="10" y="38" font-size="13" fill="#ffedd5">dτ = N · dt (Temps propre)</text>
    </g>

    <!-- Shift Badge -->
    <g transform="translate(370, 135)">
      <rect x="0" y="0" width="165" height="50" rx="6" fill="#1b1526" stroke="#fbc2eb" stroke-width="1.2" />
      <text class="label-tag" x="10" y="19" fill="#fbc2eb">VECTEUR DÉCALAGE : βⁱ</text>
      <text class="math-text" x="10" y="37" font-size="12" fill="#e9d5ff">dxⁱ = -βⁱ dt (Glissement)</text>
    </g>

    <!-- Flow Line Description -->
    <g transform="translate(440, 310)">
      <rect x="0" y="0" width="160" height="42" rx="6" fill="#16221b" stroke="#38ef7d" stroke-width="1" />
      <text class="label-tag" x="10" y="18" fill="#38ef7d">LIGNE D'UNIVERS</text>
      <text class="sub-text" x="10" y="33" fill="#86efac" font-size="11">∂_t = N n + β</text>
    </g>

  </g>

  <!-- Footer Legend & Relativistic Regimes -->
  <g transform="translate(40, 465)">
    <rect x="0" y="0" width="820" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="25" cy="20" r="5" fill="#58a6ff" />
    <text class="label-tag" x="38" y="24" fill="#c9d1d9">N = 1 : Espace plat (Minkowski)</text>
    
    <circle cx="280" cy="20" r="5" fill="#fda085" />
    <text class="label-tag" x="293" y="24" fill="#c9d1d9">0 &lt; N &lt; 1 : Puits gravitationnel (Terre / Lune / Mars)</text>

    <circle cx="630" cy="20" r="5" fill="#ff5555" />
    <text class="label-tag" x="643" y="24" fill="#c9d1d9">N → 0 : Évitement de singularité</text>
  </g>

</svg>
